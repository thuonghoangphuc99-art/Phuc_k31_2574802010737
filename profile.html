
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile cá nhân</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
        }

        
        .card {
            width: 350px;
            margin: 50px auto;
            padding: 25px;
            border: 2px solid #3498db;
            border-radius: 15px;
            background-color: white;
            text-align: center;
        }

        
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #3498db;
            object-fit: cover;
        }

        #name {
            color: #2c3e50;
            font-size: 28px;
            margin-bottom: 10px;
        }

        
        .job {
            color: #3498db;
            font-size: 18px;
            font-weight: bold;
        }

       
        .intro {
            color: #555;
            line-height: 1.6;
        }

        .skills {
            list-style: none;
            padding: 0;
        }

        .skills li {
            display: inline-block;
            background-color: #eaf2f8;
            color: #2c3e50;
            padding: 8px 12px;
            margin: 5px;
            border-radius: 8px;
        }

        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 25px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #2c3e50;
        }
    </style>
</head>

<body>

    <div class="card">
        <img
            src="https://i.pravatar.cc/150?img=12"
            alt="Ảnh đại diện"
            class="avatar"
        >

        <h1 id="name">Thượng Hoàng Phúc</h1>

        <p class="job">Sinh viên Công nghệ thông tin</p>

        <p class="intro">
            Xin chào! Tôi là sinh viên yêu thích công nghệ.
            Tôi luôn học hỏi những kiến thức mới và mong muốn
            phát triển kỹ năng lập trình của mình.
        </p>

        <h3>Kỹ năng của tôi</h3>

        <ul class="skills">
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>

        <a href="mailto:example@gmail.com" class="btn">
            Liên hệ
        </a>
    </div>

</body>
</html>
